---
name: Generate & Validate Grammar

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'grammar/**'
      - 'Makefile'
      - '.github/workflows/generate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'grammar/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Drift Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: make install

      - name: Lint, audit, and drift-check
        run: make lint

  test:
    name: Validate & Conformance
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: make install

      - name: Read version metadata
        id: meta
        run: |
          TAG=$(jq -r '.release_tag' scripts/config.json)
          VERSION=$(jq -r '.grammar_version' scripts/config.json)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch conformance fixtures
        run: make update-conformance

      - name: Validate grammar, parse examples, run conformance
        run: make test

      - name: Build and verify grammars-v4 contribution
        run: make contrib

      - name: Build ANTLR SDK release archive
        run: make sdk-archive

      - name: Assert SDK archive exists
        run: |
          test -f ".build/releases/sysml-v2-sdks-${{ steps.meta.outputs.version }}.zip"

      - name: Upload grammar artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: sysml-v2-grammar-${{ steps.meta.outputs.version }}
          path: |
            grammar/SysMLv2Parser.g4
            grammar/SysMLv2Lexer.g4
            grammar/SysMLv2Lexer.tokens
            grammar/PATCHES.md
          if-no-files-found: error

      - name: Upload contribution artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: grammars-v4-sysmlv2-${{ steps.meta.outputs.version }}
          path: contrib/sysml/sysmlv2/
          if-no-files-found: error

      - name: Upload SDK archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: sysml-v2-sdks-${{ steps.meta.outputs.version }}
          path: .build/releases/sysml-v2-sdks-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: make install

      - name: Read version metadata
        id: meta
        run: |
          TAG=$(jq -r '.release_tag' scripts/config.json)
          VERSION=$(jq -r '.grammar_version' scripts/config.json)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build contribution
        run: make contrib

      - name: Build ANTLR SDK release archive
        run: make sdk-archive

      - name: Package contribution archive
        id: archive
        run: |
          VERSION=$(jq -r '.grammar_version' scripts/config.json)
          ARCHIVE="grammars-v4-sysmlv2-${VERSION}.zip"
          cd contrib/sysml && zip -r "../../${ARCHIVE}" sysmlv2/
          echo "path=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VTAG="v${{ steps.meta.outputs.version }}"
          if gh release view "$VTAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VTAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: SysML v2 Grammar v${{ steps.meta.outputs.version }}
          body: |
            ## SysML v2 ANTLR4 Grammar v${{ steps.meta.outputs.version }}

            Generated from OMG SysML v2 Release
            [`${{ steps.meta.outputs.tag }}`][src].

            [src]: https://github.com/Systems-Modeling/SysML-v2-Release/tree/${{ steps.meta.outputs.tag }}

            ### Version Scheme
            `YYYY.MM.REV` — `YYYY.MM` tracks the OMG release, `REV` increments
            for each grammar release from that spec.

            ### Contents
            This release ships:

            - `grammars-v4-sysmlv2-${{ steps.meta.outputs.version }}.zip` —
              grammar files, examples, and a ready-to-submit contribution for
              [antlr/grammars-v4](https://github.com/antlr/grammars-v4)
            - `sysml-v2-sdks-${{ steps.meta.outputs.version }}.zip` —
              generated ANTLR4 source SDKs for every official target bundled
              with this release
          files: |
            ${{ steps.archive.outputs.path }}
            .build/releases/sysml-v2-sdks-${{ steps.meta.outputs.version }}.zip
          fail_on_unmatched_files: true

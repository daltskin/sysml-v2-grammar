---
name: Watch Upstream OMG Releases

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    name: Check for New OMG Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Read current release tag
        id: current
        run: |
          source scripts/upstream-release.sh
          TAG=$(jq -r '.release_tag' scripts/config.json)
          # Validate tag format to prevent injection via config.json
          if ! release_tag_is_valid "$TAG"; then
            echo "::error::Invalid current tag format: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Current tag: $TAG"

      - name: Fetch latest OMG release tags
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/upstream-release.sh
          # Get tags from the OMG SysML v2 Release repo
          TAGS=$(gh api repos/Systems-Modeling/SysML-v2-Release/tags --paginate --jq '.[].name')
          echo "Available tags:"
          echo "$TAGS"

          # Accept monthly releases and their dotted updates (YYYY-MM[.N]).
          LATEST=$(printf '%s\n' "$TAGS" | latest_release_tag)

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: $LATEST"

      - name: Compare versions
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.tag }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          if [ -z "$LATEST" ]; then
            echo "::error::No upstream release tags found"
            exit 1
          fi

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already up to date ($CURRENT)"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n' "$CURRENT" "$LATEST" | sort -rV | sed -n '1p')" = "$LATEST" ]; then
            echo "New release available: $CURRENT → $LATEST"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Current release $CURRENT is newer than upstream $LATEST; not downgrading"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.compare.outputs.new_release == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.compare.outputs.new_release == 'true'
        run: make install

      - name: Regenerate grammar with new tag
        id: regen
        if: steps.compare.outputs.new_release == 'true'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          source scripts/upstream-release.sh
          CURRENT_VERSION=$(jq -r '.grammar_version' scripts/config.json)
          NEW_VERSION=$(next_grammar_version "$LATEST" "$CURRENT_VERSION")

          # Update config.json with new tag and version BEFORE
          # generating, so that PATCHES.md picks up the correct version.
          jq --arg tag "$LATEST" --arg ver "$NEW_VERSION" \
            '.release_tag = $tag | .grammar_version = $ver' \
            scripts/config.json > scripts/config.json.tmp
          mv scripts/config.json.tmp scripts/config.json

          make generate TAG="$LATEST"

          # Update the "Current Spec Version" section in README.md
          REPO=$(jq -r '.release_repo' scripts/config.json)
          SOURCE_URL="https://github.com/${REPO}/tree/${LATEST}"
          sed -i \
            -e "s|- \*\*Grammar version\*\*: .*|- **Grammar version**: \`${NEW_VERSION}\`|" \
            -e "s|- \*\*OMG release\*\*: .*|- **OMG release**: \`${LATEST}\`|" \
            -e "s|- \*\*Source\*\*: .*|- **Source**: [Systems-Modeling/SysML-v2-Release](${SOURCE_URL})|" \
            README.md

      - name: Create Pull Request
        if: steps.compare.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.current.outputs.tag }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          BRANCH="upstream/$LATEST"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-push to handle reruns where the branch already exists
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: update grammar to OMG release $LATEST

          Upstream release changed from $CURRENT to $LATEST.
          Grammar files regenerated from Systems-Modeling/SysML-v2-Release@$LATEST."

          git push --force origin "$BRANCH"

          # Skip PR creation if one already exists for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH — force-pushed updated content"
            exit 0
          fi

          gh pr create \
            --title "Update grammar to OMG release $LATEST" \
            --body "## Upstream Release Update

          The OMG SysML v2 specification has a new release: **$LATEST** (was $CURRENT).

          ### Changes
          - Updated \`scripts/config.json\` release tag to \`$LATEST\`
          - Regenerated \`grammar/SysMLv2Parser.g4\` and \`grammar/SysMLv2Lexer.g4\`

          ### Source
          [Systems-Modeling/SysML-v2-Release@$LATEST](https://github.com/Systems-Modeling/SysML-v2-Release/tree/$LATEST)

          > Auto-generated by the [watch-upstream](.github/workflows/watch-upstream.yml) workflow." \
            --base main \
            --head "$BRANCH"
